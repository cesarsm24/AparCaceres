# ============================================================
# CI del backend AparCáceres.
# - Lint con ruff (lectura rápida del estilo).
# - Suite pytest contra Redis Stack real (servicio del runner) para que las
#   ramas que tocan RediSearch fallen en CI antes de llegar a develop / main.
# ============================================================

name: backend-ci

on:
  push:
    branches: [develop, main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    branches: [develop, main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      redis:
        image: redis/redis-stack-server:7.4.0-v0
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 3s
          --health-retries 10

    env:
      REDIS_HOST: localhost
      REDIS_PORT: "6379"
      REDIS_DB: "0"
      APP_ENV: development
      LOG_LEVEL: WARNING
      CORS_ORIGINS: ""

    defaults:
      run:
        working-directory: backend

    steps:
          - uses: actions/checkout@v4

          - name: Configurar Python 3.11
            uses: actions/setup-python@v5
            with:
              python-version: "3.11"
              cache: pip
              cache-dependency-path: backend/requirements-dev.txt

          - name: Instalar dependencias
            run: |
              python -m pip install --upgrade pip
              pip install -r requirements-dev.txt

          - name: Lint (ruff)
            run: ruff check app tests main.py

          - name: Instalar herramientas de Redis
            run: sudo apt-get update && sudo apt-get install -y redis-tools

          - name: Esperar a Redis Stack
            run: |
              for i in $(seq 1 30); do
                if redis-cli -h "$REDIS_HOST" -p "$REDIS_PORT" PING | grep -q PONG; then
                  echo "Redis OK"; exit 0
                fi
                sleep 1
              done
              echo "Redis no respondió a tiempo"; exit 1

          - name: Verificar RediSearch disponible
            run: |
              redis-cli -h "$REDIS_HOST" -p "$REDIS_PORT" FT._LIST || true
              redis-cli -h "$REDIS_HOST" -p "$REDIS_PORT" MODULE LIST | grep -i search

          - name: Ejecutar pytest
            run: pytest -q
